services:
  deeper:
    build: .
    image: deeper:0.2.0
    ports:
      - "${DEEPER_BIND_IP:-127.0.0.1}:${DEEPER_HOST_PORT:-8080}:8080"
    environment:
      DEEPER_TOP_SITES: "${DEEPER_TOP_SITES:-500}"
      DEEPER_SITE_TIMEOUT: "${DEEPER_SITE_TIMEOUT:-10}"
      DEEPER_SEARCH_TIMEOUT: "${DEEPER_SEARCH_TIMEOUT:-180}"
      DEEPER_CONNECTIONS: "${DEEPER_CONNECTIONS:-20}"
      DEEPER_WORKERS: "${DEEPER_WORKERS:-2}"
      DEEPER_MAX_JOBS: "${DEEPER_MAX_JOBS:-64}"
      DEEPER_RETENTION: "${DEEPER_RETENTION:-900}"
      DEEPER_CACHE_TTL: "${DEEPER_CACHE_TTL:-60}"
      DEEPER_WORKER_MAX_JOBS: "${DEEPER_WORKER_MAX_JOBS:-25}"
      DEEPER_WORKER_IDLE_TIMEOUT: "${DEEPER_WORKER_IDLE_TIMEOUT:-120}"
      DEEPER_SECURE_COOKIE: "${DEEPER_SECURE_COOKIE:-0}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
